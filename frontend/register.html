<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps: Agent Access</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .register-screen {
        position: relative;
        z-index: 1;
        max-width: 500px;
        width: 100%;
        padding: 2.5rem 2rem;
        background: rgba(10, 16, 30, 0.94);
        border: 1px solid rgba(84, 214, 255, 0.35);
        box-shadow: 0 12px 44px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .tab-navigation {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1.5rem;
        margin-bottom: 1rem;
        border-bottom: 1px solid rgba(84, 214, 255, 0.2);
        padding-bottom: 0.5rem;
      }
      .tab-btn {
        background: none;
        border: none;
        color: rgba(84, 214, 255, 0.5);
        font-family: "JetBrains Mono", Consolas, Monaco, monospace;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 0.5rem 1rem;
        transition: color 0.2s, border-color 0.2s;
        border-bottom: 2px solid transparent;
      }
      .tab-btn.active {
        color: #54d6ff;
        border-bottom-color: #54d6ff;
        text-shadow: 0 0 8px rgba(84, 214, 255, 0.4);
      }
      .register-form {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        margin-top: 1rem;
      }
      .form-group {
        text-align: left;
      }
      .form-group label {
        display: block;
        color: #92dbff;
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .register-input, .register-select {
        width: 100%;
        background: rgba(7, 12, 24, 0.9);
        border: 1px solid rgba(84, 214, 255, 0.3);
        color: #f2f6ff;
        padding: 0.8rem 1rem;
        font-family: "JetBrains Mono", Consolas, Monaco, monospace;
        transition: border-color 0.2s;
      }
      .register-input:focus, .register-select:focus {
        outline: none;
        border-color: rgba(84, 214, 255, 0.9);
        box-shadow: 0 0 8px rgba(84, 214, 255, 0.2);
      }
      .register-select option {
        background: rgba(7, 12, 24, 0.9);
        color: #f2f6ff;
      }
      .error-msg {
        color: #ff6d6d;
        font-size: 0.85rem;
        margin-top: 0.5rem;
        min-height: 1.2rem;
      }
      .loading {
        opacity: 0.5;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="background-code" aria-hidden="true"></div>

    <main class="register-screen">
      <h1>AGENT PROFILE</h1>
      <p class="subtitle" id="formSubtitle">Secure Your Operative Identity</p>

      <div class="tab-navigation">
        <button type="button" class="tab-btn active" id="tabRegister" onclick="switchMode('register')">New Operative</button>
        <button type="button" class="tab-btn" id="tabLogin" onclick="switchMode('login')">Return Login</button>
      </div>
      
      <!-- Combined form that shifts fields dynamically -->
      <form class="register-form" id="registerForm">
        <div class="form-group" id="usernameGroup">
          <label for="username">Username (Alias)</label>
          <input type="text" id="username" class="register-input" placeholder="e.g. shadow_dev" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="register-input" required placeholder="e.g. agent@dcib.gov" />
        </div>

        <div class="form-group">
          <label for="password">Password (Clearance Code)</label>
          <input type="password" id="password" class="register-input" required placeholder="e.g. ••••••••" />
        </div>
        
        <div class="form-group" id="ageGroup">
          <label for="age">Age</label>
          <input type="number" id="age" class="register-input" min="1" max="120" placeholder="e.g. 25" />
        </div>
        
        <div class="form-group" id="genderGroup">
          <label for="gender">Gender</label>
          <select id="gender" class="register-select">
            <option value="">Select...</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other / Prefer not to say</option>
          </select>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        
        <button type="submit" class="start-button" id="submitBtn" style="width: 100%; border-radius: 0; margin-top: 1rem;">INITIALIZE</button>
      </form>
    </main>

    <script src="js/register.js"></script>
    <script>
      let mode = 'register';

      function switchMode(newMode) {
        mode = newMode;
        const tabRegister = document.getElementById('tabRegister');
        const tabLogin = document.getElementById('tabLogin');
        const usernameGroup = document.getElementById('usernameGroup');
        const ageGroup = document.getElementById('ageGroup');
        const genderGroup = document.getElementById('genderGroup');
        const submitBtn = document.getElementById('submitBtn');
        const formSubtitle = document.getElementById('formSubtitle');
        const usernameInput = document.getElementById('username');

        if (mode === 'login') {
          tabRegister.classList.remove('active');
          tabLogin.classList.add('active');
          usernameGroup.style.display = 'none';
          ageGroup.style.display = 'none';
          genderGroup.style.display = 'none';
          usernameInput.removeAttribute('required');
          submitBtn.textContent = 'ACCESS CLEARANCE';
          formSubtitle.textContent = 'Retrieve Operative Progression';
        } else {
          tabRegister.classList.add('active');
          tabLogin.classList.remove('active');
          usernameGroup.style.display = 'block';
          ageGroup.style.display = 'block';
          genderGroup.style.display = 'block';
          usernameInput.setAttribute('required', '');
          submitBtn.textContent = 'INITIALIZE';
          formSubtitle.textContent = 'Secure Your Operative Identity';
        }
      }

      // Default switch state onload
      switchMode('register');
    </script>
  </body>
</html>
